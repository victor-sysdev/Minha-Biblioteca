<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Tech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>📚 Biblioteca Tech</h1>
    <p>Livros recomendados para redes, programação, inglês e cyber security</p>
</header>

<form class="search-box" method="GET" action="/">
    <input type="text" name="pesquisa" placeholder="Pesquisar livro, autor ou categoria..." value="{{ pesquisa }}">
    <button type="submit">Pesquisar</button>
</form>

<main class="container">
    {% for livro in livros %}
        <div class="card">
            <h2>{{ livro[1] }}</h2>
            <p><strong>Autor:</strong> {{ livro[2] }}</p>
            <p><strong>Categoria:</strong> {{ livro[3] }}</p>
            <p class="preco">R$ {{ livro[4] }}</p>
        </div>
    {% endfor %}
</main>

</body>
</html>
